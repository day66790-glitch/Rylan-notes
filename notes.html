<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- 已并入单页应用：直接跳转到 index.html 的笔记视图 -->
  <script>window.location.replace('index.html#notes');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔记 · Rylan's note</title>
  <meta name="description" content="查看、添加与删除本地笔记，支持从同声传译页保存的内容。" />

  <!-- 首屏渲染前应用主题，避免暗黑 / 白天闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved !== 'dark' && saved !== 'light') {
          saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', saved === 'dark');
        document.documentElement.style.colorScheme = saved;
      } catch (error) { /* 本地存储不可用时保持默认暗色 */ }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', '"Segoe UI"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="notes" class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">

  <!-- 背景装饰 -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-emerald-400/15 blur-3xl dark:bg-emerald-500/10"></div>
    <div class="absolute bottom-0 left-0 h-72 w-72 rounded-full bg-indigo-400/10 blur-3xl dark:bg-indigo-500/10"></div>
  </div>

  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/80 backdrop-blur-xl transition-colors dark:border-slate-800/70 dark:bg-slate-950/80">
    <nav class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-3 px-4 sm:px-6" aria-label="主导航">
      <a href="index.html" class="brand flex items-center gap-2.5 rounded-2xl border border-white/60 bg-white/50 px-2.5 py-1.5 shadow-sm shadow-slate-200/40 transition hover:bg-white/75 dark:border-white/10 dark:bg-white/5 dark:shadow-none dark:hover:bg-white/10" aria-label="Rylan's note 首页">
        <span class="brand__logo relative flex h-9 w-9 items-center justify-center overflow-hidden rounded-xl bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-500 text-white shadow-lg shadow-sky-500/30 ring-1 ring-white/50">
          <!-- 根目录没有 logo.png 时使用的内联 SVG：蓝色可爱风二次元小鲸鱼 -->
          <svg class="h-7 w-7" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M17.5 11.4c0-2.7 1.5-4.7 4-5.8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity=".85" />
            <path d="M21.9 5.1c.6-1.4 1.9-2.3 3.4-2.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity=".6" />
            <path d="M13.6 6.2c-1-.9-2.3-1.2-3.6-.8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity=".5" />
            <path d="M5.5 23.4c0-5.6 5.4-9.8 12.3-9.8 6.1 0 10.7 3.4 11.4 8 .2 1.1.1 2-.2 2.8 1.4 1.2 3.2 1.6 4.9 1.2-.8 2-2.6 3.2-4.8 3.3-1.5 2.8-4.6 4.7-8.5 4.7C13.3 33.6 5.5 29.8 5.5 23.4Z" fill="#ffffff" />
            <path d="M28.1 28.8c-1.2.7-2.6 1.1-4.1 1.3" stroke="#bfdbfe" stroke-width="1.4" stroke-linecap="round" />
            <circle cx="14" cy="21" r="2" fill="#1e3a8a" />
            <circle cx="14.7" cy="20.3" r=".65" fill="#ffffff" />
            <circle cx="8.8" cy="26.2" r="1.8" fill="#f9a8d4" opacity=".85" />
            <path d="M17.4 26.6c.9.9 2 1.3 3.2 1.1" stroke="#1e3a8a" stroke-width="1.3" stroke-linecap="round" />
            <path d="M11.6 29.9c2.2 1 4.7 1.3 7.2 1" stroke="#93c5fd" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </span>
        <span class="leading-tight">
          <span class="brand__name block bg-gradient-to-r from-sky-500 to-indigo-500 bg-clip-text text-sm font-semibold tracking-wide text-transparent dark:from-sky-300 dark:to-indigo-300">Rylan's note</span>
          <span class="block text-[10px] uppercase tracking-[0.18em] text-slate-400 dark:text-slate-500">Speech · Notes</span>
        </span>
      </a>

      <div class="flex items-center gap-2">
        <ul class="hidden items-center gap-1 sm:flex">
          <li><a href="index.html" data-nav class="nav-link inline-flex items-center rounded-full px-3.5 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white">同声传译</a></li>
          <li><a href="notes.html" data-nav class="nav-link inline-flex items-center rounded-full px-3.5 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white">笔记</a></li>
          <li><a href="profile.html" data-nav class="nav-link inline-flex items-center rounded-full px-3.5 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white">个人设置</a></li>
        </ul>

        <!-- 用户头像：与设置页共用 user_avatar，点击进入个人设置 -->
        <a href="profile.html" class="header-avatar" data-header-avatar aria-label="打开个人设置" title="个人设置">
          <img data-avatar-img class="is-hidden" alt="" />
          <span data-avatar-fallback>R</span>
        </a>

        <!-- iOS 风格主题开关：滑块内为当前主题图标，轨道两端为待切换主题图标 -->
        <button id="themeToggle" type="button" role="switch" aria-checked="false"
          class="theme-switch relative inline-flex h-9 w-16 shrink-0 items-center rounded-full border border-slate-200/80 bg-slate-200/80 px-1 shadow-inner transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/60 dark:border-white/10 dark:bg-slate-800/80"
          aria-label="切换暗黑 / 白天模式" title="切换暗黑 / 白天模式">
          <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          </span>
          <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </span>
          <span class="theme-switch__thumb" aria-hidden="true">
            <svg data-knob-icon="sun" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg data-knob-icon="moon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </span>
        </button>

        <button id="mobileMenuBtn" type="button" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 transition hover:text-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400 sm:hidden" aria-label="打开菜单" aria-expanded="false" aria-controls="mobileMenu">
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </nav>

    <div id="mobileMenu" class="hidden border-t border-slate-200 bg-white px-4 py-3 dark:border-slate-800 dark:bg-slate-950 sm:hidden">
      <ul class="flex flex-col gap-1">
        <li><a href="index.html" data-nav class="nav-link block rounded-xl px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300">同声传译</a></li>
        <li><a href="notes.html" data-nav class="nav-link block rounded-xl px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300">笔记</a></li>
        <li><a href="profile.html" data-nav class="nav-link block rounded-xl px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300">个人设置</a></li>
      </ul>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="mx-auto w-full max-w-3xl px-4 pb-16 pt-8 sm:px-6 sm:pt-12">

    <!-- 标题 -->
    <section class="animate-fade-up flex flex-wrap items-end justify-between gap-4">
      <div class="space-y-2">
        <span class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1 text-xs font-medium text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
          localStorage · notes
        </span>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">我的笔记</h1>
        <p class="max-w-xl text-sm leading-relaxed text-slate-500 dark:text-slate-400">
          同声传译保存的内容与手动输入的内容都会出现在这里，只存放在当前浏览器中。
        </p>
      </div>

      <div class="flex items-center gap-2">
        <span id="noteCount" class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">0 条笔记</span>
        <button id="clearAllBtn" type="button" class="hidden items-center gap-1.5 rounded-full border border-rose-200 px-3 py-1.5 text-xs font-medium text-rose-500 transition hover:bg-rose-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400/40 disabled:cursor-not-allowed disabled:opacity-40 dark:border-rose-500/30 dark:text-rose-400 dark:hover:bg-rose-500/10">
          清空全部
        </button>
      </div>
    </section>

    <!-- 添加笔记 -->
    <section class="apple-card animate-fade-up delay-1 mt-6 rounded-3xl border border-slate-200 bg-white/80 p-5 shadow-xl shadow-slate-200/50 backdrop-blur transition-colors dark:border-slate-800 dark:bg-slate-900/70 dark:shadow-none sm:p-6">
      <form id="noteForm" class="space-y-3">
        <label for="noteInput" class="block text-sm font-semibold">添加笔记</label>
        <textarea id="noteInput" rows="3" placeholder="记录一点想法…（Ctrl / ⌘ + Enter 快速保存）"
          class="w-full resize-y rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm leading-relaxed text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/15 dark:border-slate-700 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-indigo-500 dark:focus:ring-indigo-500/20"></textarea>
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="text-xs text-slate-400 dark:text-slate-500">保存时会自动记录当前的日期与时间</p>
          <button id="addNoteBtn" type="submit" class="inline-flex items-center gap-2 rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 transition hover:bg-indigo-500 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-400/40 active:scale-[0.98]">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            添加笔记
          </button>
        </div>
      </form>
    </section>

    <!-- 笔记列表 -->
    <section class="mt-8">
      <h2 class="sr-only">笔记列表</h2>
      <ul id="noteList" class="space-y-3"></ul>

      <div id="emptyState" class="hidden rounded-3xl border border-dashed border-slate-300 bg-white/60 px-6 py-14 text-center dark:border-slate-700 dark:bg-slate-900/40">
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
            <rect x="9" y="3" width="6" height="4" rx="1.5" />
            <path d="M9 12h6M9 16h4" />
          </svg>
        </span>
        <p class="mt-3 text-sm font-medium text-slate-500 dark:text-slate-400">还没有笔记</p>
        <p class="mt-1 text-xs text-slate-400 dark:text-slate-500">在上方输入内容，或前往「同声传译」录制语音。</p>
        <a href="index.html" class="mt-4 inline-flex items-center gap-1.5 rounded-full border border-indigo-200 bg-indigo-50 px-4 py-2 text-xs font-semibold text-indigo-600 transition hover:bg-indigo-100 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20">
          去录音
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 dark:border-slate-800 dark:text-slate-500">
    Rylan's note · 所有数据仅保存在本地浏览器
  </footer>

  <!-- 笔记条目模板（由 app.js 克隆填充） -->
  <template id="noteItemTemplate">
    <li class="note-item group flex items-start gap-3 rounded-2xl border border-slate-200 bg-white/90 p-4 shadow-sm transition hover:border-indigo-300 hover:shadow-md dark:border-slate-800 dark:bg-slate-900/70 dark:hover:border-indigo-500/50">
      <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-indigo-500/10 text-indigo-500 dark:bg-indigo-500/15 dark:text-indigo-300" data-note-icon></span>
      <div class="min-w-0 flex-1">
        <p class="whitespace-pre-wrap break-words text-[15px] leading-relaxed text-slate-700 dark:text-slate-200" dir="auto" data-note-text></p>
        <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-400 dark:text-slate-500">
          <span data-note-time></span>
          <span class="inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-medium uppercase tracking-wide text-slate-500 dark:bg-slate-800 dark:text-slate-400" data-note-source></span>
        </div>
      </div>
      <button type="button" data-delete-id="" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-400 transition hover:bg-rose-50 hover:text-rose-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400/40 dark:hover:bg-rose-500/10 dark:hover:text-rose-400" aria-label="删除这条笔记">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M10 11v6M14 11v6" />
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
        </svg>
      </button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
